[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "split-cli"
version = "0.1.0a1"
description = "Splitting group expenses made it fun on your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Malizia" }]
keywords = ["cli", "expenses", "group-expenses", "terminal", "rich", "typer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "pydantic>=2.7,<3.0",
  "plotext>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "build>=1.2,<2.0",
  "twine>=6.1,<7.0",
]

[project.scripts]
split-cli = "split_cli.cli:app"

[project.urls]
Homepage = "https://github.com/0xlukem/Split-CLI"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/split_cli"]
